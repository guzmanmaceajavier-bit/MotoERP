server {
    listen 8000;
    server_name _;
    root /app/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Health checks — serve directly, no DB, no rewrite loops
    location = /health {
        try_files $uri /index.php?$query_string;
    }
    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; try_files $uri =204; }
    location = /robots.txt  { access_log off; log_not_found off; try_files $uri =204; }
    location = /favicon.svg { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
